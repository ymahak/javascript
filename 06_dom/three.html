<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body>
    <!--  Create new element in DOM  -->
</body>
<script>
    const div = document.createElement('div')
    div.className = "new";
    div.id = Math.round(Math.random() * 10 + 1)
    div.setAttribute("title" , "Mahak") //if we want to add any new attribute
    div.style.backgroundColor = "pink";
    //div.innerHTML = "Hello ji , Sb bdiya? "
    const addText = document.createTextNode("Hello ji , Kya haal")
    div.appendChild(addText);
    document.body.appendChild(div);
</script>
</html>
