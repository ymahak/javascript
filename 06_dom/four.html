<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>
<body style="background-color: #212121; color: #fff;">
    <ul class="language">
        <li>JavaScript</li>
    </ul>
</body>
<script>
    function addLang(langName){
        const li = document.createElement('li')
        li.innerHTML = `${langName} `
        document.querySelector('.language').
        appendChild(li) //This method is not good for huge code as ye pura pura tree traverse kr ke aaraha h neeche(optimization issue ajata h )

    }
    addLang("Python")
    addLang("Java")

    // Optimization tarike se add krna h 
    function addOptiLang(langName){
        const li = document.createElement('li')
        li.appendChild(document.createTextNode(langName))
        document.querySelector('.language').
        appendChild(li)
    }
    addOptiLang("TypeScript")

    //Edit 
    const secLang = document.querySelector("li:nth-child(2)")
    //secLang.innerHTML = "Mahal"
    const newLi = document.createElement('li')
    newLi.textContent = "Mahak"
    secLang.replaceWith(newLi)

   // Same if we want to edit the 1st Li 
    const secnLang = document.querySelector("li:first-child")
    const newwLi = document.createElement('li')
    newwLi.textContent = "Nya kuch bhi"
    secnLang.replaceWith(newwLi)
    //secnLand.outerHTML = '<li>1st change </li>'

    //Remove
    const lastLang = document.querySelector("li:last-child")
    lastLang.remove()
    


</script>
</html>
